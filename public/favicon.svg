<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Clip path to keep rainbow rays inside the circle -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Circular background container -->
  <g clip-path="url(#circleClip)">
    <!-- Soft background fill -->
    <rect width="200" height="200" fill="#FDF8F6" />

    <!-- Rainbow vertical/fan arched beams from top to bottom -->
    <!-- Beam 1: Soft Cyan/Blue -->
    <path d="M 0,0 L 42,0 L 52,200 L 0,200 Z" fill="#38BDF8" />
    <!-- Beam 2: Soft Mint Green -->
    <path d="M 42,0 L 82,0 L 86,200 L 52,200 Z" fill="#4ADE80" />
    <!-- Beam 3: Soft Golden Yellow -->
    <path d="M 82,0 L 122,0 L 118,200 L 86,200 Z" fill="#FDE047" />
    <!-- Beam 4: Soft Apricot Orange -->
    <path d="M 122,0 L 162,0 L 152,200 L 118,200 Z" fill="#FB923C" />
    <!-- Beam 5: Soft Pink / Coral -->
    <path d="M 162,0 L 200,0 L 200,200 L 152,200 Z" fill="#F472B6" />
  </g>

  <!-- Outer circular border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#F1F5F9" stroke-width="4" />

  <!-- House Body with Heart -->
  <g transform="translate(100, 112)">
    <!-- House White Fill -->
    <path d="M 0,-48 L 52,0 L 40,0 L 40,46 L -40,46 L -40,0 L -52,0 Z" fill="#FFFFFF" />

    <!-- Heart on Roof (White fill behind stroke) -->
    <path d="M -30,-42 C -38,-50 -48,-42 -44,-32 C -40,-24 -30,-16 -30,-16 C -30,-16 -20,-24 -16,-32 C -12,-42 -22,-50 -30,-42 Z" fill="#FFFFFF" />

    <!-- Heart Outline -->
    <path d="M -30,-40 C -37,-48 -47,-40 -43,-30 C -39,-22 -30,-14 -30,-14 C -30,-14 -21,-22 -17,-30 C -13,-40 -23,-48 -30,-40 Z" fill="#FFFFFF" stroke="#9F1239" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- House Outline (Thick Crimson Stroke) -->
    <path d="M -50,2 L 0,-44 L 50,2" fill="none" stroke="#9F1239" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -36,0 L -36,46 L 36,46 L 36,0" fill="none" stroke="#9F1239" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
